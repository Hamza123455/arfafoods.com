<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add New (embedded)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="addnew.css">
</head>
<body>
<div class="content">
  <h1 class="heading-purple display-6 mb-3">Add New</h1>

  <!-- Connection bar -->
  <div class="bg-light-blue p-3 rounded shadow-sm mb-3 d-flex align-items-center flex-wrap gap-2">
    <div class="file-status me-3">
      <span class="dot dot-off" id="statusDot"></span>
      <span id="statusText">Not connected</span>
    </div>
    <button class="btn btn-outline-secondary btn-sm" id="refreshBtn"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
    <span class="ms-auto text-muted small" id="lastSynced"></span>
  </div>

  <div class="row g-3">
    <!-- Add form -->
    <div class="col-lg-6">
      <div class="card shadow-sm">
        <div class="card-header bg-white fw-bold">Add a New Item, Cold Store, or Vendour</div>
        <div class="card-body">
          <label class="form-label">What are you adding?</label>
          <div class="row g-2 mb-3">
            <div class="col-4">
              <div class="card type-card text-center p-2 active" id="typeCardItems" data-type="items">
                <i class="bi bi-box-seam"></i>
                <div class="small mt-1">Item</div>
              </div>
            </div>
            <div class="col-4">
              <div class="card type-card text-center p-2" id="typeCardColdStores" data-type="coldStores">
                <i class="bi bi-snow"></i>
                <div class="small mt-1">Cold Store</div>
              </div>
            </div>
            <div class="col-4">
              <div class="card type-card text-center p-2" id="typeCardVendours" data-type="vendours">
                <i class="bi bi-truck"></i>
                <div class="small mt-1">Vendour</div>
              </div>
            </div>
          </div>

          <label class="form-label" id="nameLabel">Item Name</label>
          <input type="text" class="form-control" id="newName" placeholder="Type the name...">
          <div class="form-text" id="nameHint">&nbsp;</div>

          <button class="btn btn-voucher mt-3" id="addNewBtn" disabled><i class="bi bi-plus-circle"></i> Add New</button>
        </div>
      </div>
    </div>

    <!-- Current lists -->
    <div class="col-lg-6">
      <div class="card shadow-sm h-100">
        <div class="card-header bg-white fw-bold">Current Lists</div>
        <div class="card-body">
          <ul class="nav nav-tabs" id="listTabs">
            <li class="nav-item"><button class="nav-link active" data-list="items" type="button">Items <span class="badge bg-secondary rounded-pill" id="tabCountItems">0</span></button></li>
            <li class="nav-item"><button class="nav-link" data-list="coldStores" type="button">Cold Stores <span class="badge bg-secondary rounded-pill" id="tabCountColdStores">0</span></button></li>
            <li class="nav-item"><button class="nav-link" data-list="vendours" type="button">Vendours <span class="badge bg-secondary rounded-pill" id="tabCountVendours">0</span></button></li>
          </ul>
          <div class="list-group list-scroll mt-2" id="listDisplay"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Confirm before saving -->
<div class="modal fade" id="confirmAddModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirm New Entry</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="mb-0">Add <strong id="confirmTypeLabel"></strong> "<strong id="confirmNameLabel"></strong>" to the list?</p>
        <p class="text-muted small mt-2 mb-0">This becomes available immediately in the dropdowns on the Receipts page for every PC.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-voucher" id="confirmAddBtn"><i class="bi bi-check-circle"></i> Confirm & Save</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="addnew.js"></script>
</body>
</html>
