<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arfa Foods</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="bvdr.css">
</head>
<body>
<div class="content">
  <h1 class="heading-purple display-6 mb-3">Vendour Summary</h1>
  <div class="bg-light-blue p-3 rounded shadow-sm mb-3 d-flex align-items-center flex-wrap gap-2">
    <div class="file-status me-3">
      <span class="dot dot-off" id="statusDot"></span>
      <span id="statusText">Not connected</span>
    </div>
    <button class="btn btn-outline-secondary btn-sm" id="refreshBtn"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
    <span class="ms-auto text-muted small" id="lastSynced"></span>
  </div>
  <div class="stats-row" id="grandStats"></div>
  <div class="card shadow-sm">
    <div class="card-header bg-white fw-bold">Vendour Summary</div>
    <div class="card-body">
      <input type="text" class="form-control mb-3" id="searchInput" placeholder="Search vendours...">
      <div id="reportContainer">
        <p class="text-muted text-center py-4">Connect to data source above to load the report.</p>
      </div>
    </div>
  </div>
</div>
<div class="modal fade" id="ledgerModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="ledgerTitle">Ledger</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="table-responsive">
          <table class="table table-sm table-striped mb-0">
            <thead class="table-light">
              <tr>
                <th>Receipt No</th><th>Date</th><th>Vendour</th><th>Description</th><th>Unit</th>
                <th>Stock In</th><th>Stock Out</th><th>Qty Balance</th>
                <th>Weight In</th><th>Weight Out</th><th>Weight Balance</th>
                <th>Vehicle No</th><th>Driver</th><th></th>
              </tr>
            </thead>
            <tbody id="ledgerBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="modal fade" id="printModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">View Receipt</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body bg-light">
        <div id="printArea" class="print-slip"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-purple" id="printBtn"><i class="bi bi-printer"></i> Print Slip</button>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="bvdr.js"></script>
</body>
</html>
