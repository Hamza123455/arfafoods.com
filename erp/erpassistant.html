<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Arfa Foods</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="erpstyles.css">
</head>
<body>
<topbar>
  <button class="icon-btn" id="toggleBtn" title="Toggle sidebar" aria-label="Toggle sidebar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="6"  x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <a class="topbar-logo" href="#">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="16 18 22 12 16 6"/>
      <polyline points="8 6 2 12 8 18"/>
    </svg>
    Script Code
  </a>

  <div class="topbar-right">
    <div class="search-wrap">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="searchInput" type="search" placeholder="Search snippets…" autocomplete="off"/>
    </div>

    <!-- Theme toggle -->
    <label id="themeBtn" title="Toggle light/dark mode" aria-label="Toggle theme">
      <input type="checkbox" id="themeCheck"/>
      <div class="toggle-track">
        <span class="toggle-icon">🌙</span>
        <span class="toggle-icon">☀️</span>
      </div>
    </label>
  </div>
</topbar>

<div class="layout">
  <div id="sidebar">
    <div class="sidebar-head">Script Files</div>
    <div id="fileList"></div>
  </div>
  <div id="overlay"></div>

  <div id="content">
    <div id="welcome">
      <div class="welcome-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
      </div>
      <h2>Select a file to get started</h2>
      <p>Pick a script file from the sidebar to browse and copy its snippets.</p>
    </div>

    <div id="snippetPanel" style="display:none">
      <div class="content-header">
        <span class="content-title" id="panelTitle"></span>
        <span id="countLabel"></span>
      </div>
      <div id="grid"></div>
    </div>
  </div>
</div>

<script src="erpscript.js" defer></script>
</body>
</html>
