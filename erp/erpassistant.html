<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Script Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── DARK THEME (default) ── */
:root,[data-theme="dark"]{
  --bg:#0D1117;
  --surface:#161B22;
  --surface2:#1C2128;
  --surface3:#21262D;
  --border:#30363D;
  --border-soft:#21262D;
  --accent:#58A6FF;
  --accent-bg:rgba(88,166,255,.1);
  --accent-border:rgba(88,166,255,.25);
  --glow:rgba(88,166,255,.12);
  --text:#E6EDF3;
  --text-soft:#C9D1D9;
  --muted:#8B949E;
  --muted2:#6E7681;
  --green:#3FB950;
  --green-bg:rgba(63,185,80,.1);
  --purple:#BC8CFF;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 16px rgba(0,0,0,.5);
  --shadow-lg:0 8px 32px rgba(0,0,0,.6);
  --topbar-bg:rgba(13,17,23,.92);
  --mono:'JetBrains Mono',monospace;
  --sans:'Inter',sans-serif;
  --sidebar:248px;
  --radius:8px;
}

/* ── LIGHT THEME ── */
[data-theme="light"]{
  --bg:rgb(222,240,245);
  --surface:rgb(236,247,250);
  --surface2:rgb(210,234,241);
  --surface3:rgb(197,228,237);
  --border:rgb(163,207,220);
  --border-soft:rgb(195,228,238);
  --accent:#0077A8;
  --accent-bg:rgba(0,119,168,.09);
  --accent-border:rgba(0,119,168,.22);
  --glow:rgba(0,119,168,.1);
  --text:#0D2B35;
  --text-soft:#1A3D4D;
  --muted:#3B6B7A;
  --muted2:#5A8A99;
  --green:#1A7F37;
  --green-bg:rgba(26,127,55,.1);
  --purple:#6A3ACD;
  --shadow-sm:0 1px 3px rgba(0,80,110,.1);
  --shadow-md:0 4px 16px rgba(0,80,110,.13);
  --shadow-lg:0 8px 32px rgba(0,80,110,.16);
  --topbar-bg:rgba(179,219,232,.92);
}

html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--sans);display:flex;flex-direction:column;
  min-height:100vh;transition:background .2s,color .2s;
}

/* ── TOPBAR ── */
topbar{
  display:flex;align-items:center;gap:.65rem;
  padding:0 1.1rem;height:54px;
  background:var(--topbar-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:200;flex-shrink:0;
  box-shadow:var(--shadow-sm);
}

.icon-btn{
  background:none;border:1px solid transparent;color:var(--muted);
  cursor:pointer;padding:.32rem;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  transition:color .15s,background .15s,border-color .15s;flex-shrink:0;
}
.icon-btn:hover{color:var(--text);background:var(--surface2);border-color:var(--border)}

.topbar-logo{
  display:flex;align-items:center;gap:.45rem;
  font-weight:600;font-size:.88rem;color:var(--text);
  text-decoration:none;white-space:nowrap;letter-spacing:-.01em;
}
.topbar-logo svg{color:var(--accent)}

.topbar-right{display:flex;align-items:center;gap:.5rem;margin-left:auto}

/* search */
.search-wrap{position:relative;width:220px}
.search-wrap svg{
  position:absolute;left:8px;top:50%;transform:translateY(-50%);
  color:var(--muted);pointer-events:none;
}
#searchInput{
  width:100%;background:var(--surface2);
  border:1px solid var(--border);border-radius:6px;
  padding:.34rem .7rem .34rem 1.85rem;
  color:var(--text);font-family:var(--sans);font-size:.79rem;
  outline:none;transition:border-color .18s,box-shadow .18s,background .18s;
}
#searchInput::placeholder{color:var(--muted2)}
#searchInput:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-bg);
  background:var(--surface);
}

/* theme toggle */
#themeBtn{position:relative;width:36px;height:20px;flex-shrink:0}
#themeBtn input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{
  display:flex;align-items:center;justify-content:space-between;
  width:36px;height:20px;background:var(--surface3);
  border:1px solid var(--border);border-radius:10px;
  padding:0 3px;cursor:pointer;transition:background .2s,border-color .2s;
  position:relative;overflow:hidden;
}
.toggle-track::after{
  content:'';position:absolute;
  width:14px;height:14px;border-radius:50%;
  background:var(--accent);top:2px;left:2px;
  transition:transform .22s cubic-bezier(.4,0,.2,1),background .2s;
  box-shadow:var(--shadow-sm);
}
#themeBtn input:checked + .toggle-track::after{transform:translateX(16px)}
.toggle-icon{font-size:.6rem;line-height:1;z-index:1;transition:opacity .2s}

/* ── LAYOUT ── */
.layout{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
#sidebar{
  width:var(--sidebar);flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  transition:transform .25s cubic-bezier(.4,0,.2,1),width .25s cubic-bezier(.4,0,.2,1);
  overflow:hidden;
}
#sidebar.closed{width:0}

.sidebar-head{
  padding:.8rem 1rem .6rem;
  border-bottom:1px solid var(--border-soft);
  font-size:.67rem;font-weight:600;
  letter-spacing:.1em;color:var(--muted);
  text-transform:uppercase;flex-shrink:0;
}

#fileList{flex:1;overflow-y:auto;padding:.35rem 0}
#fileList::-webkit-scrollbar{width:3px}
#fileList::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.file-item{
  display:flex;align-items:center;gap:.5rem;
  padding:.52rem 1rem;cursor:pointer;
  font-size:.81rem;color:var(--muted);
  border-left:2px solid transparent;
  transition:background .13s,color .13s,border-color .13s;
  user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.file-item:hover{background:var(--surface2);color:var(--text-soft)}
.file-item.active{
  background:var(--accent-bg);color:var(--accent);
  border-left-color:var(--accent);font-weight:500;
}
.file-item svg{flex-shrink:0;opacity:.55;transition:opacity .13s}
.file-item:hover svg,.file-item.active svg{opacity:1}

/* ── CONTENT ── */
#content{
  flex:1;overflow-y:auto;
  padding:1.6rem clamp(.85rem,3vw,2rem);
}
#content::-webkit-scrollbar{width:5px}
#content::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.content-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:1.25rem;flex-wrap:wrap;gap:.6rem;
}
.content-title{
  font-size:.95rem;font-weight:600;
  color:var(--text);letter-spacing:-.01em;
}
#countLabel{
  font-size:.74rem;color:var(--muted);
  background:var(--surface2);border:1px solid var(--border);
  padding:.18rem .55rem;border-radius:20px;
}

/* ── WELCOME ── */
#welcome{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;padding:3rem 1.5rem;text-align:center;gap:.55rem;
}
.welcome-icon{
  width:52px;height:52px;border-radius:14px;
  background:var(--surface2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:.5rem;color:var(--muted);
  box-shadow:var(--shadow-sm);
}
#welcome h2{font-size:.95rem;font-weight:600;color:var(--text);letter-spacing:-.01em}
#welcome p{font-size:.8rem;color:var(--muted);line-height:1.6;max-width:260px}

/* ── GRID ── */
#grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,500px),1fr));
  gap:.9rem;
}

/* ── CARD ── */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;display:flex;flex-direction:column;
  transition:border-color .18s,box-shadow .18s,transform .18s;
  position:relative;box-shadow:var(--shadow-sm);
}
.card-accent-bar{
  height:2px;
  background:linear-gradient(90deg,var(--accent) 0%,var(--purple) 100%);
  transform:scaleX(0);transform-origin:left;
  transition:transform .24s cubic-bezier(.4,0,.2,1);
  border-radius:var(--radius) var(--radius) 0 0;
}
.card:hover{
  border-color:var(--accent-border);
  box-shadow:var(--shadow-md);
  transform:translateY(-1px);
}
.card:hover .card-accent-bar{transform:scaleX(1)}

.card-top{
  padding:.8rem .9rem .6rem;
}
.card-title{
  font-size:.86rem;font-weight:600;
  color:var(--text);margin-bottom:.22rem;
  letter-spacing:-.01em;line-height:1.35;
}
.card-desc{
  font-size:.74rem;color:var(--muted);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

/* code block */
.code-area{
  flex:1;background:var(--surface2);
  border-top:1px solid var(--border-soft);
}
.code-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:.35rem .75rem;border-bottom:1px solid var(--border-soft);
  background:var(--surface3);
}
.code-bar span{
  font-size:.65rem;color:var(--muted2);
  font-family:var(--mono);letter-spacing:.02em;
}
.copy-btn{
  display:flex;align-items:center;gap:.28rem;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:5px;color:var(--muted);
  font-family:var(--sans);font-size:.67rem;font-weight:500;
  padding:.2rem .55rem;cursor:pointer;
  transition:border-color .15s,color .15s,background .15s,box-shadow .15s;
  white-space:nowrap;
}
.copy-btn:hover{
  border-color:var(--accent);color:var(--accent);
  background:var(--accent-bg);
  box-shadow:0 0 0 2px var(--accent-bg);
}
.copy-btn.ok{
  border-color:var(--green);color:var(--green);
  background:var(--green-bg);
}

pre{
  margin:0;padding:.7rem .9rem;
  overflow-x:auto;max-height:220px;
  font-family:var(--mono);font-size:.73rem;
  line-height:1.65;color:var(--text-soft);tab-size:2;
}
[data-theme="light"] pre{color:#0D2B35}
pre::-webkit-scrollbar{height:4px;width:4px}
pre::-webkit-scrollbar-track{background:transparent}
pre::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
pre::-webkit-scrollbar-thumb:hover{background:var(--muted2)}

/* ── STATES ── */
.state{
  grid-column:1/-1;text-align:center;
  padding:3.5rem 1rem;color:var(--muted);font-size:.84rem;
}
.spin{
  width:22px;height:22px;margin:0 auto .75rem;
  border:2px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:rot .6s linear infinite;
}
@keyframes rot{to{transform:rotate(360deg)}}

/* ── OVERLAY ── */
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:150;backdrop-filter:blur(2px)}

/* ── MOBILE ── */
@media(max-width:640px){
  #sidebar{position:fixed;top:54px;left:0;bottom:0;z-index:160;transform:translateX(0)}
  #sidebar.closed{transform:translateX(-100%);width:var(--sidebar)}
  #overlay.show{display:block}
  .search-wrap{width:160px}
}
@media(max-width:400px){
  .search-wrap{display:none}
}

/* ── FOCUS VISIBLE ── */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>

<topbar>
  <button class="icon-btn" id="toggleBtn" title="Toggle sidebar" aria-label="Toggle sidebar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="6"  x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <a class="topbar-logo" href="#">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="16 18 22 12 16 6"/>
      <polyline points="8 6 2 12 8 18"/>
    </svg>
    Script Code
  </a>

  <div class="topbar-right">
    <div class="search-wrap">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="searchInput" type="search" placeholder="Search snippets…" autocomplete="off"/>
    </div>

    <!-- Theme toggle -->
    <label id="themeBtn" title="Toggle light/dark mode" aria-label="Toggle theme">
      <input type="checkbox" id="themeCheck"/>
      <div class="toggle-track">
        <span class="toggle-icon">🌙</span>
        <span class="toggle-icon">☀️</span>
      </div>
    </label>
  </div>
</topbar>

<div class="layout">
  <div id="sidebar">
    <div class="sidebar-head">Script Files</div>
    <div id="fileList"></div>
  </div>
  <div id="overlay"></div>

  <div id="content">
    <div id="welcome">
      <div class="welcome-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
      </div>
      <h2>Select a file to get started</h2>
      <p>Pick a script file from the sidebar to browse and copy its snippets.</p>
    </div>

    <div id="snippetPanel" style="display:none">
      <div class="content-header">
        <span class="content-title" id="panelTitle"></span>
        <span id="countLabel"></span>
      </div>
      <div id="grid"></div>
    </div>
  </div>
</div>

<script>
// ================================================================
//  ADD YOUR JSON FILES HERE
// ================================================================
const FILES = [
  {
    label: "JavaScript",
    url: "https://raw.githubusercontent.com/Hamza123455/masterfile/main/erp_assistant_code/invoice_posting.json"
  },
  /*{
    label: "Python",
    url: "https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO/main/python.json"
  },*/
];
// ================================================================

const fileList     = document.getElementById("fileList");
const welcome      = document.getElementById("welcome");
const snippetPanel = document.getElementById("snippetPanel");
const panelTitle   = document.getElementById("panelTitle");
const countLabel   = document.getElementById("countLabel");
const grid         = document.getElementById("grid");
const searchInput  = document.getElementById("searchInput");
const sidebar      = document.getElementById("sidebar");
const overlay      = document.getElementById("overlay");
const themeCheck   = document.getElementById("themeCheck");

let currentSnippets = [];

// ── Theme ──
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  themeCheck.checked = (theme === "light");
  localStorage.setItem("theme", theme);
}

// Load saved theme or default dark
applyTheme(localStorage.getItem("theme") || "dark");

themeCheck.addEventListener("change", () => {
  applyTheme(themeCheck.checked ? "light" : "dark");
});

// ── Sidebar ──
FILES.forEach((f, i) => {
  const item = document.createElement("div");
  item.className = "file-item";
  item.setAttribute("role", "button");
  item.setAttribute("tabindex", "0");
  item.innerHTML = `
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
    </svg>
    <span>${esc(f.label)}</span>`;
  item.addEventListener("click", () => loadFile(i));
  item.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " ") loadFile(i); });
  fileList.appendChild(item);
});

// ── Load file ──
async function loadFile(i) {
  fileList.querySelectorAll(".file-item").forEach((el, j) =>
    el.classList.toggle("active", j === i));

  if (window.innerWidth <= 640) closeSidebar();

  welcome.style.display = "none";
  snippetPanel.style.display = "block";
  panelTitle.textContent = FILES[i].label;
  countLabel.textContent = "";
  searchInput.value = "";
  grid.innerHTML = `<div class="state"><div class="spin"></div>Loading snippets…</div>`;

  try {
    const res = await fetch(FILES[i].url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    currentSnippets = Array.isArray(data) ? data : (data.snippets ?? []);
    render();
  } catch (err) {
    grid.innerHTML = `<div class="state">
      <p style="font-size:.9rem;margin-bottom:.3rem;color:var(--text)">⚠ Failed to load</p>
      <p style="font-size:.75rem">${err.message}</p>
    </div>`;
  }
}

// ── Render cards ──
function render() {
  const q = searchInput.value.trim().toLowerCase();
  const list = currentSnippets.filter(s =>
    !q || [s.title, s.description, s.code]
      .filter(Boolean).some(v => v.toLowerCase().includes(q))
  );

  countLabel.textContent = list.length + (list.length !== 1 ? " snippets" : " snippet");

  if (!list.length) {
    grid.innerHTML = `<div class="state">No snippets match your search.</div>`;
    return;
  }

  grid.innerHTML = list.map(s => {
    const code  = s.code || "";
    const lines = code.split("\n").length;
    return `
    <article class="card">
      <div class="card-accent-bar"></div>
      <div class="card-top">
        <div class="card-title">${esc(s.title || "Untitled")}</div>
        ${s.description ? `<div class="card-desc">${esc(s.description)}</div>` : ""}
      </div>
      <div class="code-area">
        <div class="code-bar">
          <span>${lines} line${lines !== 1 ? "s" : ""}</span>
          <button class="copy-btn" data-code="${encodeURIComponent(code)}">
            ${iCopy()} Copy
          </button>
        </div>
        <pre><code>${esc(code)}</code></pre>
      </div>
    </article>`;
  }).join("");

  grid.querySelectorAll(".copy-btn").forEach(btn =>
    btn.addEventListener("click", async () => {
      const text = decodeURIComponent(btn.dataset.code);
      try { await navigator.clipboard.writeText(text); } catch { fbCopy(text); }
      btn.classList.add("ok");
      btn.innerHTML = iCheck() + " Copied!";
      setTimeout(() => { btn.classList.remove("ok"); btn.innerHTML = iCopy() + " Copy"; }, 2000);
    })
  );
}

searchInput.addEventListener("input", render);

// ── Toggle sidebar ──
document.getElementById("toggleBtn").addEventListener("click", () => {
  sidebar.classList.toggle("closed");
  overlay.classList.toggle("show");
});
overlay.addEventListener("click", closeSidebar);
function closeSidebar() {
  sidebar.classList.add("closed");
  overlay.classList.remove("show");
}

// ── Helpers ──
function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function fbCopy(t) {
  const ta = Object.assign(document.createElement("textarea"), {value:t, style:"position:fixed;opacity:0"});
  document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
}
function iCopy() {
  return `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
}
function iCheck() {
  return `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
}
</script>
</body>
</html>
